name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: checkout neoos-kernel (toolchain/build.sh, shim)
        run: git clone --depth 1 https://github.com/NeoOSOrganization/neoos-kernel neoos-kernel-ref
      - name: cache cross-toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/cross-x86_64-elf
          key: x86_64-elf-toolchain-${{ hashFiles('neoos-kernel-ref/toolchain/build.sh') }}
      - name: build cross-toolchain (skips if cache hit)
        run: neoos-kernel-ref/toolchain/build.sh
      - name: checkout and build neoos-musl
        run: |
          git config --global protocol.git.allow always
          git clone --depth 1 https://github.com/NeoOSOrganization/neoos-musl ../neoos-musl
          (cd ../neoos-musl && git submodule update --init upstream)
          export PATH="$HOME/opt/cross-x86_64-elf/bin:$PATH"
          (cd ../neoos-musl && make KERNEL_SHIM_DIR=$(pwd)/../neoos-kernel-ref/third_party/shim)
      - name: build
        run: |
          export PATH="$HOME/opt/cross-x86_64-elf/bin:$PATH"
          make MUSL_DIR=../neoos-musl/build-output
      - run: ./smoke-test.sh
